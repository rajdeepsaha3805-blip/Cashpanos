<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations | Cashpanos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <header>
        <a href="index.html" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="40" stroke="url(#paint0_linear)" stroke-width="4"/>
                <path d="M40 30 V70 M60 30 V70" stroke="url(#paint1_linear)" stroke-width="4" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="paint0_linear" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="#00F5D4"/><stop offset="1" stop-color="#00FF87"/></linearGradient>
                    <linearGradient id="paint1_linear" x1="40" y1="30" x2="60" y2="70" gradientUnits="userSpaceOnUse"><stop stop-color="#00F5D4"/><stop offset="1" stop-color="#00FF87"/></linearGradient>
                </defs>
            </svg>
            <span class="logo-text">Cashpanos</span>
        </a>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li><a href="services.html">Interactive Menu</a></li>
                <li><a href="contact.html" class="active">Reservations</a></li>
            </ul>
        </nav>
        <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
    </header>

    <main>
        <section class="fade-in" style="padding-top: 6rem;">
            <div style="max-width: 500px; margin: 0 auto; background: var(--bg-container); padding: 3rem; border-radius: 16px; border: 1px solid var(--glass-border);">
                <h2 style="text-align: center; margin-bottom: 2rem;">Book a <span class="highlight">Table</span></h2>
                <form id="resForm" novalidate>
                    <div style="margin-bottom: 1.5rem;">
                        <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <input type="date" id="date" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-glow" style="width: 100%;">Confirm Reservation</button>
                    <p id="success-msg" style="display: none; color: var(--accent-neon); text-align: center; margin-top: 1rem; font-weight: 600;">Reservation Sent!</p>
                </form>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('resForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(this.checkValidity()) {
                document.getElementById('success-msg').style.display = 'block';
                this.reset();
                setTimeout(() => document.getElementById('success-msg').style.display = 'none', 4000);
            }
        });
    </script>
</body>
</html>
