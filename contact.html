<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations | Cashpanos</title>
    <link class="jsbin" href="http://ajax.googleapis.com/ajax/libs/jqueryui/1/themes/base/jquery-ui.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* --- Top Notification Toast --- */
        .top-notification {
            position: fixed;
            top: -100px; /* Hidden offscreen by default */
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FF6B00, #FFB800);
            color: #ffffff;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
            font-weight: 600;
            font-size: 1rem;
            z-index: 9999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-notification.show {
            top: 24px; /* Slides down to view */
        }

        /* --- Upgraded Card UI --- */
        .reservation-card {
            max-width: 480px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3rem 2.5rem; 
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .reservation-card:hover {
            transform: translateY(-4px);
        }

        .card-title {
            text-align: center; 
            margin-bottom: 2.5rem;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 1.75rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Flexible Adaptive Inputs --- */
        /* Dark Theme Defaults (White Text / Black Fields) */
        .form-control {
            width: 100%;
            padding: 1rem 1.25rem;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #FF6B00;
            box-shadow: 0 0 0 4px rgba(246, 107, 0, 0.2);
        }

        /* Light Theme System Inversion (Black Text / White Fields) */
        /* Targets body if a .light-theme class is added by your theme toggle */
        [data-theme="light"] .form-control {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] .form-control:focus {
            box-shadow: 0 0 0 4px rgba(246, 107, 0, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 1.1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="top-toast" class="top-notification">
        <span>✨ Reservation Confirmed Successfully!</span>
    </div>

    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <header>
        <a href="index.html" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="40" stroke="url(#paint0_linear)" stroke-width="4"/>
                <path d="M40 30 V70 M60 30 V70" stroke="url(#paint1_linear)" stroke-width="4" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="paint0_linear" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="#FF6B00"/><stop offset="1" stop-color="#FFB800"/></linearGradient>
                    <linearGradient id="paint1_linear" x1="40" y1="30" x2="60" y2="70" gradientUnits="userSpaceOnUse"><stop stop-color="#FF6B00"/><stop offset="1" stop-color="#FFB800"/></linearGradient>
                </defs>
            </svg>
            <span class="logo-text">Cashpanos</span>
        </a>
        <div class="nav-actions">
            <nav>
                <ul id="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">Our Story</a></li>
                    <li><a href="services.html">Interactive Menu</a></li>
                    <li><a href="contact.html" class="active">Reservations</a></li>
                </ul>
            </nav>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Light/Dark Mode">☀️</button>
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
        </div>
    </header>

    <main>
        <section class="fade-in" style="padding: 8rem 1rem 4rem 1rem; box-sizing: border-box;">
            <div class="reservation-card">
                <h2 class="card-title">Book a <span class="highlight">Table</span></h2>
                <form id="resForm" novalidate>
                    
                    <div class="form-group">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="date" class="form-label">Reservation Date</label>
                        <input type="date" id="date" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="btn btn-glow btn-submit">Confirm Reservation</button>
                </form>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        // Form Submission and Slide-Down Notification Logic
        document.getElementById('resForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(this.checkValidity()) {
                const toast = document.getElementById('top-toast');
                
                // Show the top banner
                toast.classList.add('show');
                this.reset();
                
                // Hide the top banner after 4 seconds
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 4000);
            }
        });
    </script>
</body>
</html>
