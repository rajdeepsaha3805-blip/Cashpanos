<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Cashpanos</title>
    <meta name="description" content="Get in touch with Cashpanos sales and support.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5L90 25V75L50 95L10 75V25L50 5Z" stroke="url(#paint0_linear)" stroke-width="4" stroke-linejoin="round"/>
                <path d="M50 30L70 40V60L50 70L30 60V40L50 30Z" fill="url(#paint1_linear)"/>
                <defs>
                    <linearGradient id="paint0_linear" x1="10" y1="5" x2="90" y2="95" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#00FF87"/>
                        <stop offset="1" stop-color="#00E5FF"/>
                    </linearGradient>
                    <linearGradient id="paint1_linear" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#00FF87"/>
                        <stop offset="1" stop-color="#00E5FF"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="logo-text">Cashpanos</span>
        </a>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
            ☰
        </button>
    </header>

    <main>
        <section>
            <div class="contact-container">
                <h2 style="text-align: center; margin-bottom: 2rem;">Get In <span class="highlight">Touch</span></h2>
                <form id="contactForm" novalidate>
                    <div class="form-group" id="group-name">
                        <label class="form-label" for="name">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="John Doe">
                        <div class="error-msg">Please enter your name.</div>
                    </div>
                    <div class="form-group" id="group-email">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="john@example.com">
                        <div class="error-msg">Please enter a valid email address.</div>
                    </div>
                    <div class="form-group" id="group-message">
                        <label class="form-label" for="message">Message</label>
                        <textarea id="message" class="form-control" placeholder="How can we help you?"></textarea>
                        <div class="error-msg">Please enter a message.</div>
                    </div>
                    <button type="submit" class="btn btn-glow" style="width: 100%; margin-top: 1rem;">Send Message</button>
                </form>
                <div id="success-msg" style="display: none; text-align: center; color: var(--accent-emerald); margin-top: 1.5rem; font-weight: 600;">
                    Your message has been sent successfully!
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cashpanos. All rights reserved.</p>
    </footer>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('nav-menu');
        btn.addEventListener('click', () => {
            menu.classList.toggle('active');
        });

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();
            
            // Validate name
            if(name === '') {
                document.getElementById('group-name').classList.add('error');
                isValid = false;
            } else {
                document.getElementById('group-name').classList.remove('error');
            }
            
            // Validate email
            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if(!email.match(emailPattern)) {
                document.getElementById('group-email').classList.add('error');
                isValid = false;
            } else {
                document.getElementById('group-email').classList.remove('error');
            }
            
            // Validate message
            if(message === '') {
                document.getElementById('group-message').classList.add('error');
                isValid = false;
            } else {
                document.getElementById('group-message').classList.remove('error');
            }
            
            if(isValid) {
                document.getElementById('success-msg').style.display = 'block';
                this.reset();
                setTimeout(() => {
                    document.getElementById('success-msg').style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
